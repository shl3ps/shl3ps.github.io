# ===== CONFIGURACIÓN DE shl3ps's blog (tema Chirpy) =====

theme: jekyll-theme-chirpy

lang: es-ES
timezone: America/Panama

title: "shl3ps's blog"
tagline: "Reversing · Low-Level Programming · Offensive Security"
description: "Low-level, notas, análisis de binarios y writeups de CTF."

url: "https://shl3ps.github.io"
baseurl: ""

github:
  username: shl3ps

twitter:
  username: shl3ps

social:
  name: shl3ps
  links:
    - https://github.com/shl3ps
    - https://x.com/shl3ps

theme_mode: dark

avatar: "/assets/img/avatar.png"

toc: true
paginate: 10

pwa:
  enabled: false

# ------------ No modificar de aquí hacia abajo ------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

